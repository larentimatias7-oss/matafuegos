version: '3.8'

services:
  matafuegos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milicic-matafuegos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - PORT=3000
      - DATA_DIR=/data
      - BASE_URL=http://localhost:3000
    env_file:
      - .env
    volumes:
      - matafuegos-data:/data

volumes:
  matafuegos-data:
    name: milicic_matafuegos_data
