    <text x="270" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">SUPERADMIN</text>

    <rect x="320" y="0" width="85" height="30" fill="#0f172a"/>
